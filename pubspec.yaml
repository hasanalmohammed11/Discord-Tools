name: discord_tools
description: "All-in-one utility hub for Discord users: File Center with Supabase storage, Bots directory, and Discord tools."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Supabase Backend & Storage
  supabase_flutter: ^2.8.0

  # File picking & sharing
  file_picker: ^8.1.4
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  path: ^1.9.0

  # State Management & Utils
  provider: ^6.1.2
  intl: ^0.19.0
  http: ^1.2.2
  flutter_colorpicker: ^1.1.0
  cached_network_image: ^3.4.1

  # Start.io Ads SDK
  # For Android Start.io Ads (App ID: 208250285)
  # startapp_sdk: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
